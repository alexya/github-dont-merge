<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Don't Merge</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">Merge warnings</p>
      <h1>GitHub Don't Merge</h1>
      <p class="description">Visual warnings for GitHub pull requests.</p>
      <section class="status" aria-labelledby="status-title">
        <h2 id="status-title">Label-based warning</h2>
        <p>Matching labels add a red frame around the merge controls. This is a visual reminder only; merging is not blocked.</p>
      </section>
      <p id="version" class="version"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
